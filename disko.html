<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Disko</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #debug{position:fixed;left:4px;bottom:2px;color:#ffffff99;font:11px monospace;display:none;z-index:5}
  #panel{position:fixed;top:10px;right:10px;width:390px;max-height:calc(100vh - 20px);overflow:auto;z-index:10;
    background:rgba(16,10,32,.96);color:#fff;border:1px solid #6b3fd6;border-radius:14px;padding:14px 16px;
    font:14px "Segoe UI",Arial,sans-serif;box-shadow:0 10px 40px #000a}
  #panel[hidden]{display:none}
  #panel h3{margin:0 0 6px;font-size:19px} #panel h3 small{font-weight:400;color:#b9a8e8;font-size:12px}
  #panel h4{margin:14px 0 6px;color:#ffd23f;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
  #panel .stat{background:#ffffff10;border-radius:8px;padding:6px 9px;line-height:1.5}
  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0}
  #panel .row label{flex:1;color:#ddd}
  #panel input[type=number]{width:80px} #panel input[type=text]{width:170px}
  #panel input{background:#0b0716;color:#fff;border:1px solid #4b3a7a;border-radius:6px;padding:4px 6px;font:inherit}
  #panel button{background:#3b1f7a;color:#fff;border:0;border-radius:8px;padding:6px 10px;margin:3px 3px 0 0;cursor:pointer;font:inherit}
  #panel button:hover{background:#5a2fb8} #panel button.red{background:#7a1f3b}
  #panel .role{display:flex;justify-content:space-between;align-items:center;background:#ffffff0d;border-radius:8px;padding:4px 8px;margin:3px 0}
  #panel .empty{color:#8f84aa}
  #pLinkOut{width:100%;box-sizing:border-box;margin-top:6px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="debug"></div>
<div id="panel" hidden>
  <h3>Disko Panel <small>H ile aç / kapat</small></h3>
  <div class="stat" id="pStat"></div>
  <h4>Roller</h4><div id="pRoles"></div>
  <h4>Test</h4>
  <div id="pTest">
    <button data-t="chat">Yorum</button><button data-t="gift">Küçük hediye</button><button data-t="pod">Podyum</button>
    <button data-t="vip">VIP</button><button data-t="dj">DJ (Perfume)</button><button data-t="owner">Sahip (Crown)</button>
    <button data-t="big">Büyük hediye</button><button data-t="like">1000 beğeni</button>
    <button data-t="fill">Pisti doldur</button><button data-t="demo">Demo aç/kapat</button><button data-t="clear" class="red">Pisti boşalt</button>
  </div>
  <h4>Ayarlar <small style="color:#b9a8e8;text-transform:none">(anında uygulanır)</small></h4>
  <div id="pSet"></div>
  <div style="margin-top:10px">
    <button id="pLink">Ayarlı linki oluştur</button><button id="pReset" class="red">Varsayılana dön</button>
    <input id="pLinkOut" type="text" readonly placeholder="LIVE Studio'ya bu linki yapıştır">
  </div>
</div>
<script>
// =====================================================================
//  DİSKO – TikTok canlı yayın sahnesi  (v1)
//  H tuşu: panel. Ayarlar panelden değişir; varsayılanlar aşağıda.
// =====================================================================
const DEF = {
  WS_URL: 'ws://localhost:21213/', // TikFinity masaüstü WebSocket adresi
  MAX: 150,              // pistteki en fazla kişi
  IDLE_MIN: 10,          // bu kadar dakika yorum yazmayan pistten çıkar
  NPC_FILL: 0,           // isimsiz figüran sayısı (0 = kapalı)
  ZOOM_SEC: 3.5,         // hediye zoom süresi (sn)
  VIP_COINS: 30,         // VIP loca (3 kişi, dolunca en eski gider)
  PODIUM_COINS: 10,      // podyum (2 kişi)
  DJ_GIFTS: 'Perfume, Parfüm',     // DJ olan hediye(ler)in adı
  OWNER_GIFTS: 'Crown, Taç',       // mekanın sahibi olan hediye(ler)in adı
  ROLE_MIN: 3,           // DJ / VIP / podyum süresi (dk)
  OWNER_MIN: 5,          // mekanın sahibi süresi (dk)
  BIG_COINS: 100,        // tek seferde bu kadar coin -> ışık şovu
  LIKE_STEPS: '1000, 5000, 10000, 20000', // bu toplam beğenilerde pist coşar (ekranda yazı yok)
  LIKE_REPEAT: 10000,    // son eşikten sonra her bu kadar beğenide bir daha coşar (0 = kapalı)
  AUTO_CAM: true,        // ara sıra kendi kendine küçük kamera hareketleri
  MAX_BUBBLES: 9, BUBBLE_SEC: 5, BPM: 124
};
const VERSION = 'Disko v1';
const Q = new URLSearchParams(location.search);
const CFG = Object.assign({}, DEF);
try { if (Q.get('cfg')) Object.assign(CFG, JSON.parse(Q.get('cfg'))); } catch (e) {}
try { Object.assign(CFG, JSON.parse(localStorage.getItem('disko_cfg') || '{}')); } catch (e) {}
if (Q.get('ws')) CFG.WS_URL = Q.get('ws');
function saveCfg() {
  const diff = {}; for (const k in DEF) if (CFG[k] !== DEF[k]) diff[k] = CFG[k];
  try { localStorage.setItem('disko_cfg', JSON.stringify(diff)); } catch (e) {}
  return diff;
}

// ---------------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Segoe UI", "Arial", sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hash(a, b, c) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
function short(s, n) { s = String(s || ''); return [...s].length > n ? [...s].slice(0, n - 1).join('') + '…' : s; }
const norm = s => String(s || '').toLocaleLowerCase('tr').trim();
const inList = (name, list) => !!name && String(list || '').split(',').map(norm).filter(Boolean).includes(norm(name));

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', resize); resize();
let T = performance.now() / 1000;

// ---------------- geometri ----------------
const FY0 = 785;
const hwF = y => 330 + (y - FY0) * 0.42;
const hwD = y => Math.min(500, 0.82 * hwF(y));
const sc = y => 0.62 + 0.58 * clamp((y - 840) / 890, 0, 1);
const PODIUM_H = 36;
// rol yerleri
const SPOTS = {
  owner: [{ x: 940, y: 748, s: 1.5 }],
  dj: [{ x: 540, y: 745, s: 1.7 }],
  vip: [{ x: 64, y: 752, s: 1.22 }, { x: 141, y: 752, s: 1.22 }, { x: 218, y: 752, s: 1.22 }],
  podium: [{ x: 175, y: 1200 }, { x: 905, y: 1200 }]
};
const holders = { owner: [null], dj: [null], vip: [null, null, null], podium: [null, null] };
const RANK = { podium: 1, vip: 2, dj: 3, owner: 4 };
const ROLE_NAME = { podium: 'Podyum', vip: 'VIP', dj: 'DJ', owner: 'Mekanın Sahibi' };

function buildSlots() {
  const out = [], rows = 12;
  for (let r = 0; r < rows; r++) {
    const y = lerp(845, 1725, Math.pow(r / (rows - 1), 1.08));
    const s = sc(y), hw = hwD(y), sp = 60 * s, n = Math.floor(2 * hw / sp);
    const x0 = 540 - (n - 1) * sp / 2;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * sp + (r % 2 ? sp * 0.22 : -sp * 0.22) + rand(-7, 7) * s;
      const yy = y + rand(-12, 12) * s;
      if (SPOTS.podium.some(p => Math.abs(x - p.x) < 115 && yy > p.y - 115 && yy < p.y + 70)) continue;
      out.push({ x, y: yy, used: null });
    }
  }
  return out;
}
const slots = buildSlots();
const maxCap = () => Math.min(CFG.MAX, slots.length);

// ---------------- görünüm ----------------
const SKIN = ['#f7d7b5', '#eac096', '#d9a273', '#b97a4f', '#8d5a3b', '#f2c9a0'];
const HAIRC = ['#1b1209', '#3b2414', '#6b3e1f', '#a8692e', '#d8b25a', '#e8e0d0', '#b8322e', '#2a2a40', '#ff5fa2', '#4fc3ff', '#9b59ff'];
const TOPS = ['#ff3b8d', '#29e3ff', '#ffd23f', '#a855f7', '#22c55e', '#ff7a1a', '#ffffff', '#f43f5e', '#3b82f6', '#e5e7eb', '#111827', '#14b8a6', '#d4af37', '#c0c0d0'];
const PANTS = ['#1f2937', '#111827', '#334155', '#1e3a8a', '#e5e7eb', '#7c2d12', '#4c1d95', '#f5f5f5'];
const SHOES = ['#111', '#fff', '#c0392b', '#f5d142', '#8b5cf6'];
function randomLook(fem) {
  fem = fem ?? Math.random() < 0.5;
  return {
    fem, skin: pick(SKIN), hairC: pick(HAIRC),
    hair: fem ? pick(['long', 'pony', 'bun', 'afro', 'bob', 'curly', 'long']) : pick(['short', 'spiky', 'afro', 'buzz', 'curly', 'slick', 'mohawk', 'short']),
    top: pick(TOPS), pants: pick(PANTS), dress: fem && Math.random() < 0.55,
    shades: Math.random() < 0.22, sparkle: Math.random() < 0.35, shoe: pick(SHOES)
  };
}
const DJ_LOOK = { fem: false, skin: '#d9a273', hairC: '#1b1209', hair: 'slick', top: '#111827', pants: '#111827', dress: false, shades: true, sparkle: true, shoe: '#fff' };

// ---------------- pozlar ----------------
const MOVES = ['bounce', 'pump', 'travolta', 'side', 'spin', 'robot', 'hands', 'jump', 'shuffle'];
function pickMove() { if (T < frenzyUntil) return pick(FRENZY_MOVES); return (energy > 65 && Math.random() < 0.4) ? pick(['jump', 'hands', 'pump']) : pick(MOVES); }
function basePose() { return { bob: 0, lean: 0, dx: 0, flip: 1, la: [0.35, 0.5], ra: [0.35, 0.5], spread: 7, lfx: 0, rfx: 0, lly: 0, rly: 0, jump: 0 }; }
function pose(move, off, b) {
  const bb = b + off, ph = ((bb % 1) + 1) % 1, bi = Math.floor(bb), up = Math.sin(Math.PI * ph);
  const P = basePose(); P.bob = -up * 4;
  switch (move) {
    case 'bounce': P.la = [0.4 + 0.25 * up, 1.3]; P.ra = [0.4 + 0.25 * up, 1.3]; P.lean = Math.sin(Math.PI * bb / 2) * 0.06; break;
    case 'pump': { const a = bi % 2; P.la = a ? [2.9, 0.15 + 0.4 * up] : [0.5, 1.6]; P.ra = a ? [0.5, 1.6] : [2.9, 0.15 + 0.4 * up]; break; }
    case 'travolta': { const a = Math.floor(bb / 2) % 2, sg = a ? 1 : -1; P.lean = 0.12 * sg; P.dx = 3 * sg;
      if (a) { P.ra = [2.5, 0]; P.la = [0.9, -2.1]; } else { P.la = [2.5, 0]; P.ra = [0.9, -2.1]; } break; }
    case 'side': P.dx = Math.sin(Math.PI * bb / 2) * 7; P.la = [0.5, -1.9 + 0.3 * up]; P.ra = [0.5, -1.9 + 0.3 * up]; P.lean = -Math.cos(Math.PI * bb / 2) * 0.08; break;
    case 'spin': { if ((((bi % 4) + 4) % 4) === 3) P.flip = Math.cos(ph * Math.PI * 2); P.la = [1.5, 0.2]; P.ra = [1.5, 0.2]; break; }
    case 'robot': { const a = bi % 2; P.bob = a ? -2 : 0; P.la = [1.57, a ? 1.57 : 0]; P.ra = [1.57, a ? 0 : 1.57]; break; }
    case 'hands': { const w = Math.sin(Math.PI * bb / 2); P.la = [2.7 + 0.25 * w, 0.3]; P.ra = [2.7 - 0.25 * w, 0.3]; P.lean = w * 0.08; break; }
    case 'jump': P.jump = up * 10 * (0.6 + energy / 250); P.bob = 0; P.la = [2.8, 0.2]; P.ra = [2.8, 0.2]; P.spread = 5; break;
    case 'shuffle': { const a = bi % 2; P.lfx = a ? -5 : 2; P.rfx = a ? -2 : 5; P.lly = a ? up * 4 : 0; P.rly = a ? 0 : up * 4; P.la = [0.6, -1.2]; P.ra = [0.6, -1.2]; P.dx = (a ? -1 : 1) * 2; break; }
    case 'cheers': { const w = Math.sin(Math.PI * bb / 2); P.ra = [2.2 + 0.3 * up, 0.9]; P.la = [0.6 + 0.2 * w, 1.2]; P.lean = w * 0.07; break; }
    case 'boss': { const m = Math.floor(bb / 4) % 3, w = Math.sin(Math.PI * bb);
      if (m === 0) { P.ra = [2.6 + 0.25 * w, 0.5]; P.la = [0.9, -2.1]; }      // el sallama
      else if (m === 1) { P.ra = [1.9, -0.3]; P.la = [1.9, -0.3]; P.bob = -up * 2; } // kollar açık
      else { P.ra = [2.5, 0]; P.la = [0.9, -2.1]; P.lean = 0.08; }            // işaret
      break; }
  }
  if (Math.abs(P.flip) < 0.08) P.flip = P.flip < 0 ? -0.08 : 0.08;
  return P;
}
function walkPose(ph) {
  const P = basePose(), s = Math.sin(ph);
  P.bob = -Math.abs(s) * 2; P.la = [0.25 + 0.3 * s, 0.3]; P.ra = [0.25 - 0.3 * s, 0.3];
  P.lfx = s * 4; P.rfx = -s * 4; P.lly = Math.max(0, s) * 5; P.rly = Math.max(0, -s) * 5; P.spread = 4;
  return P;
}

// ---------------- karakter çizimi ----------------
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r2 = i % 2 ? r * 0.35 : r; ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); }
  ctx.closePath(); ctx.fill();
}
function drawFigure(L, P, x, y, s, o = {}) {
  ctx.save();
  ctx.translate(x, y - (o.lift || 0));
  ctx.globalAlpha = o.alpha ?? 1;
  if (!o.noShadow) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 1, 15 * s, 4.5 * s, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.translate(P.dx * s, -P.jump * s);
  ctx.scale(s * (o.face || 1) * P.flip, s);
  if (o.glow) {
    const pulse = 0.75 + 0.25 * Math.sin(T * 6);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, -42, 4, 0, -42, 58 * o.glow.k);
    g.addColorStop(0, o.glow.c + 'cc'); g.addColorStop(0.5, o.glow.c + '55'); g.addColorStop(1, o.glow.c + '00');
    ctx.globalAlpha = (o.alpha ?? 1) * pulse; ctx.fillStyle = g; circle(ctx, 0, -42, 58 * o.glow.k); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = T * 2 + i * Math.PI / 2;
      ctx.fillStyle = '#fff8d0'; star(Math.cos(a) * 26, -45 + Math.sin(a) * 34, 3.2 + Math.sin(T * 8 + i) * 1.2);
    }
    ctx.restore();
  }
  const hipY = -34 + P.bob, ty = -62 + P.bob;
  if (o.cape) {
    ctx.save(); ctx.translate(0, hipY); ctx.rotate(P.lean); ctx.translate(0, -hipY);
    const cg = ctx.createLinearGradient(0, ty, 0, ty + 50); cg.addColorStop(0, '#c4122f'); cg.addColorStop(1, '#5e0616');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(-12, ty + 2); ctx.lineTo(12, ty + 2); ctx.lineTo(21 + Math.sin(T * 3) * 2, ty + 52); ctx.lineTo(-21 + Math.sin(T * 3 + 1) * 2, ty + 52); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = L.dress ? L.skin : L.pants; ctx.lineWidth = 6.5;
  const lf = [-P.spread + P.lfx, -P.lly], rf = [P.spread + P.rfx, -P.rly];
  leg(-4.5, hipY, lf); leg(4.5, hipY, rf);
  ctx.fillStyle = L.shoe;
  ctx.beginPath(); ctx.ellipse(lf[0] - 1.5, lf[1] - 1.5, 4.8, 2.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(rf[0] + 1.5, rf[1] - 1.5, 4.8, 2.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(0, hipY); ctx.rotate(P.lean); ctx.translate(0, -hipY);
  ctx.fillStyle = o.suit || L.top;
  if (L.dress && !o.suit) {
    ctx.beginPath(); ctx.moveTo(-9.5, ty); ctx.lineTo(9.5, ty); ctx.lineTo(16, ty + 38); ctx.lineTo(-16, ty + 38); ctx.closePath(); ctx.fill();
  } else {
    rr(ctx, -11, ty, 22, 30, 5); ctx.fill();
    ctx.fillStyle = L.pants; ctx.fillRect(-10.5, ty + 25, 21, 5);
  }
  if (L.sparkle || o.suit) {
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) {
      const tw = hash(i, Math.floor(T * 5), (x | 0));
      if (tw > 0.45) { ctx.globalAlpha = (o.alpha ?? 1) * tw; circle(ctx, -6 + i * 4, ty + 6 + (i % 2) * 9, 1.3); ctx.fill(); }
    }
    ctx.globalAlpha = o.alpha ?? 1;
  }
  if (o.chain) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, ty + 1, 7, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); ctx.fillStyle = '#ffd700'; circle(ctx, 0, ty + 9, 2.4); ctx.fill(); }
  ctx.fillStyle = L.skin; ctx.fillRect(-3, ty - 4, 6, 6);
  const armC = o.suit ? { top: o.suit, skin: L.skin } : L;
  arm(-1, P.la[0], P.la[1], -10, ty + 4, armC);
  const hr = arm(1, P.ra[0], P.ra[1], 10, ty + 4, armC);
  if (o.prop === 'glass') {
    ctx.fillStyle = 'rgba(255,220,120,.9)'; ctx.beginPath(); ctx.moveTo(hr[0] - 3.5, hr[1] - 12); ctx.lineTo(hr[0] + 3.5, hr[1] - 12); ctx.lineTo(hr[0] + 1.2, hr[1] - 4); ctx.lineTo(hr[0] - 1.2, hr[1] - 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e8e8f0'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(hr[0], hr[1] - 4); ctx.lineTo(hr[0], hr[1] + 1); ctx.stroke();
  }
  drawHead(L, 0, ty - 11, o);
  ctx.restore();
  ctx.restore();
}
function leg(hx, hy, f) {
  ctx.beginPath(); ctx.moveTo(hx, hy);
  ctx.quadraticCurveTo((hx + f[0]) / 2 + (hx < 0 ? -1.8 : 1.8), (hy + f[1]) / 2, f[0], f[1] - 2); ctx.stroke();
}
function arm(side, a1, a2, sx, sy, L) {
  const ex = sx + side * Math.sin(a1) * 13, ey = sy + Math.cos(a1) * 13;
  const a = a1 + a2, hx = ex + side * Math.sin(a) * 12, hy = ey + Math.cos(a) * 12;
  ctx.strokeStyle = L.top; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.strokeStyle = L.skin; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = L.skin; circle(ctx, hx, hy, 3.2); ctx.fill();
  return [hx, hy];
}
function drawHead(L, hx, hy, o) {
  const r = 10.5;
  ctx.fillStyle = L.hairC;
  if (L.hair === 'afro') { circle(ctx, hx, hy - 3, 16.5); ctx.fill(); }
  if (L.hair === 'long') { rr(ctx, hx - 12.5, hy - 4, 25, 23, 6); ctx.fill(); }
  if (L.hair === 'bob') { rr(ctx, hx - 12.5, hy - 4, 25, 14, 6); ctx.fill(); }
  if (L.hair === 'pony') { ctx.beginPath(); ctx.ellipse(hx + 12 + Math.sin(beat * Math.PI) * 2, hy + 3, 4.5, 9, 0.35, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = L.skin; circle(ctx, hx, hy, r); ctx.fill();
  ctx.fillStyle = L.hairC;
  const cap = (rad, a0, a1) => { ctx.beginPath(); ctx.arc(hx, hy, rad, Math.PI * a0, Math.PI * a1); ctx.closePath(); ctx.fill(); };
  switch (L.hair) {
    case 'buzz': cap(r + 0.4, 1.08, 1.92); break;
    case 'spiky': cap(r + 1.2, 0.95, 2.05);
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(hx + i * 4 - 3, hy - r + 2); ctx.lineTo(hx + i * 4.6, hy - r - 6); ctx.lineTo(hx + i * 4 + 3, hy - r + 2); ctx.fill(); } break;
    case 'mohawk': cap(r + 0.3, 1.1, 1.9); rr(ctx, hx - 2.5, hy - r - 7, 5, 11, 2); ctx.fill(); break;
    case 'bun': cap(r + 1.2, 0.95, 2.05); circle(ctx, hx, hy - r - 3, 5.2); ctx.fill(); break;

document.getElementById('pLink').addEventListener('click', () => {
  const diff = saveCfg(), url = location.origin + location.pathname + (Object.keys(diff).length ? '?cfg=' + encodeURIComponent(JSON.stringify(diff)) : '');
  const out = document.getElementById('pLinkOut'); out.value = url; out.select();
  try { navigator.clipboard.writeText(url); } catch (e) {}
});
document.getElementById('pReset').addEventListener('click', () => {
  for (const k in DEF) CFG[k] = DEF[k]; saveCfg(); buildSettings(); reconnect();
});
addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'h') { panel.hidden = !panel.hidden; if (!panel.hidden) { buildSettings(); refreshPanel(); } }
  if (k === 'escape') panel.hidden = true;
});

// ?demo=120 -> 120 sahte kişi + sürekli sahte olaylar (deneme için)
if (Q.has('demo')) {
  const n = parseInt(Q.get('demo')) || 0;
  for (let i = 0; i < n; i++) { const u = fakeUser(); if (!dancers.has(u.uniqueId)) addDancer(u.uniqueId, u.nickname, null, { instant: true }); }
  toggleDemo();
}
requestAnimationFrame(frame);
</script>
